name: RickyOS firmware (Read Pico)

# Builds the RickyOS product image for Read Pico (ESP32-S3).
#
# The upstream CI only builds the CrossMux product envs (default / x4pro), and
# the nightly release builds readpico_nightly. Neither produces a RickyOS
# firmware: [env:rickyos_readpico] is a separate product environment with its
# own TLS/EPDIY/SD-card/PMU patches, the Chinese-first font trim and the
# trimmed app profile. This workflow builds that environment and uploads the
# resulting firmware.bin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rickyos-firmware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: 10

jobs:
  build-rickyos-readpico:
    name: Build RickyOS firmware (Read Pico)
    runs-on: ubuntu-latest
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Use runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build RickyOS firmware
        run: |
          set -euo pipefail
          pio run -e rickyos_readpico | tee pio.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## RickyOS firmware build stats"
            echo '```text'
            grep -E '^Processing |RAM:\\s|Flash:\\s|SUCCESS|FAILED' pio.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The OTA updater refuses an image that leaves less than 512 KiB free in
      # the 6,553,600 byte app slot (src/network/RickyOtaPolicy.h), so the
      # release budget is a hard limit. Print where the bytes go to make the
      # next cut a measured decision instead of a guess.
      - name: Report Flash usage by symbol
        run: |
          set -euo pipefail
          NM="$(find "$PLATFORMIO_CORE_DIR/packages" -type f -name 'xtensa-esp32s3-elf-nm' 2>/dev/null | head -1)"
          SIZE="$(find "$PLATFORMIO_CORE_DIR/packages" -type f -name 'xtensa-esp32s3-elf-size' 2>/dev/null | head -1)"
          {
            echo "### sections"
            if [ -n "$SIZE" ]; then "$SIZE" -A .pio/build/rickyos_readpico/firmware.elf | head -30; fi
            echo "### every symbol of 64 bytes or more"
            if [ -n "$NM" ]; then
              "$NM" --size-sort -S -C --radix=d .pio/build/rickyos_readpico/firmware.elf | awk '$2 >= 64'
            fi
          } | tee flash-symbols.txt
          cat flash-symbols.txt >> "$GITHUB_STEP_SUMMARY"

      # Which source file costs how much: the object files keep the answer in the
      # same order as the tree, so a cut can be pointed at a file, not a guess.
      # This is a measurement, so it must not take the build down with it.
      - name: Report Flash usage by source file
        run: |
          set -uo pipefail
          SIZE="$(find "$PLATFORMIO_CORE_DIR/packages" -type f -name 'xtensa-esp32s3-elf-size' 2>/dev/null | head -1)"
          : > object-sizes.txt
          if [ -n "$SIZE" ]; then
            while IFS= read -r obj; do
              total=$("$SIZE" "$obj" 2>/dev/null | awk 'NR==2 {print $1 + $2}')
              printf '%10d  %s\n' "${total:-0}" "${obj#.pio/build/rickyos_readpico/}" >> object-sizes.txt
            done < <(find .pio/build/rickyos_readpico -name '*.o' -type f)
          fi
          sort -rn object-sizes.txt > object-sizes-sorted.txt
          head -60 object-sizes-sorted.txt | tee flash-by-source.txt
          cat flash-by-source.txt >> "$GITHUB_STEP_SUMMARY"

      # The device-side guard compares the image rounded up to 4 KiB against the
      # slot minus the 512 KiB reserve, so the binary is what decides whether an
      # OTA install is accepted -- not the PlatformIO "Flash: used" number.
      # The step reports the overage but does not fail the job: the image itself
      # still has to be uploaded, and the upstream baseline is over the same
      # line, so this is a measurement rather than a gate.
      - name: Check the OTA image against the slot budget
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          IMAGE=.pio/build/rickyos_readpico/firmware.bin
          BYTES="$(stat -c%s "$IMAGE")"
          ROUNDED=$(( (BYTES + 4095) / 4096 * 4096 ))
          LIMIT=6029312
          {
            echo "## OTA image budget"
            echo "| metric | bytes |"
            echo "| --- | --- |"
            echo "| firmware.bin | ${BYTES} |"
            echo "| rounded up to 4 KiB | ${ROUNDED} |"
            echo "| limit (slot 6,553,600 - 512 KiB reserve) | ${LIMIT} |"
            echo "| headroom | $(( LIMIT - ROUNDED )) |"
          } | tee ota-budget.txt
          cat ota-budget.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$ROUNDED" -gt "$LIMIT" ]; then
            echo "::error::firmware.bin needs ${ROUNDED} bytes, over the ${LIMIT} byte OTA budget by $(( ROUNDED - LIMIT ))"
          fi

      # The image is the point of the workflow: upload it even when a report step
      # above stumbled, and never let a missing report hide the firmware.
      - name: Upload the Flash symbol report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: flash-symbols
          path: |
            flash-symbols.txt
            flash-by-source.txt
            ota-budget.txt
          if-no-files-found: warn

      - name: Upload firmware.bin artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: firmware.bin
          path: .pio/build/rickyos_readpico/firmware.bin
          if-no-files-found: error

      # The Read Pico factory layout (partitions_16M.csv) is incompatible with
      # this one: the factory app slot is 2 MB and phy_init sits at 0xE000 where
      # otadata goes, while this image needs a 6.25 MB slot.  A first install is
      # therefore a full layout install, not an app-only write, so the boot
      # components have to be published next to the application image:
      #
      #   bootloader.bin  @ 0x0      (32768 bytes reserved for it)
      #   partitions.bin  @ 0x8000
      #   boot_app0.bin   @ 0xe000
      #   firmware.bin    @ 0x10000
      #
      # See docs/engineering/read-pico.md "Partition / flash plan".  The
      # component set must come from this same build; never mix components from
      # another board or another build.
      # PlatformIO merges the four pieces into firmware.factory.bin but does not
      # copy boot_app0.bin into the build directory; it ships inside the
      # framework package.  The otadata partition lives at 0xE000, so this file
      # has to be written there for the device to boot the new application
      # instead of whatever slot the previous otadata record still points at.
      - name: Collect the boot components
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          BUILD=.pio/build/rickyos_readpico
          BOOT_APP0="$BUILD/boot_app0.bin"
          if [ ! -f "$BOOT_APP0" ]; then
            FOUND="$(find "$PLATFORMIO_CORE_DIR/packages" -type f -name 'boot_app0.bin' 2>/dev/null | head -1)"
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$BOOT_APP0"
              echo "boot_app0.bin taken from $FOUND"
            fi
          fi
          if [ ! -f "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin not found in the framework packages"
            exit 1
          fi
          if [ ! -f "$BUILD/firmware.factory.bin" ]; then
            echo "::warning::firmware.factory.bin was not produced by this build"
          fi

      - name: Report the boot components
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo "## Boot components (full-install offsets)"
            echo '```text'
            for name in bootloader partitions boot_app0; do
              file=".pio/build/rickyos_readpico/${name}.bin"
              if [ -f "$file" ]; then
                printf '%-16s %10s bytes  sha256 %s\n' "${name}.bin" \
                  "$(stat -c%s "$file")" "$(sha256sum "$file" | cut -d' ' -f1)"
              else
                printf '%-16s MISSING\n' "${name}.bin"
              fi
            done
            if [ -f .pio/build/rickyos_readpico/firmware.factory.bin ]; then
              printf '%-16s %10s bytes  sha256 %s\n' "factory.bin" \
                "$(stat -c%s .pio/build/rickyos_readpico/firmware.factory.bin)" \
                "$(sha256sum .pio/build/rickyos_readpico/firmware.factory.bin | cut -d' ' -f1)"
            fi
            echo '```'
          } | tee boot-components.txt
          cat boot-components.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full-install component set
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: rickyos-install
          path: |
            .pio/build/rickyos_readpico/bootloader.bin
            .pio/build/rickyos_readpico/partitions.bin
            .pio/build/rickyos_readpico/boot_app0.bin
            .pio/build/rickyos_readpico/firmware.bin
            .pio/build/rickyos_readpico/firmware.factory.bin
            boot-components.txt
          if-no-files-found: error

  # Publish every successful main-branch build as an immutable GitHub Release.
  # CI artifacts expire after 90 days; Release assets are retained permanently.
  # Tag is derived from the commit so each build has its own version, and a
  # re-run clobbers the assets of an existing release instead of failing.
  publish:
    name: Publish firmware Release
    needs: build-rickyos-readpico
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: rickyos-install
          path: install

      - name: Assemble release assets
        run: |
          set -euo pipefail
          BUILD=install/.pio/build/rickyos_readpico
          # Keep the bootloader/boot components from this same build only: the
          # device refuses a mixed set, and the factory slot layout is exact.
          test -f "$BUILD/firmware.bin"
          cp "$BUILD/firmware.bin" firmware.bin
          cp "$BUILD/bootloader.bin" bootloader.bin
          cp "$BUILD/partitions.bin" partitions.bin
          cp "$BUILD/boot_app0.bin" boot_app0.bin
          cp "$BUILD/firmware.factory.bin" firmware.factory.bin
          cp install/boot-components.txt boot-components.txt
          sha256sum firmware.bin bootloader.bin partitions.bin \
            boot_app0.bin firmware.factory.bin boot-components.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        env:
          SHORT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short="${SHORT_SHA::7}"
          {
            echo "## RickyOS for MindReset Read Pico — \`$short\`"
            echo
            echo "Automated build from commit \`$short\` (CI run #${RUN_NUMBER})."
            echo "Firmware for the Read Pico (ESP32-S3, 16 MB flash)."
            echo
            echo "### Install"
            echo
            echo "- **App-only upgrade** (device already on this partition layout): write \`firmware.bin\` at \`0x10000\`. Books, vocabulary, quotes and settings are preserved."
            echo "- **Full install** (factory layout): write \`bootloader.bin\` at \`0x0\`, \`partitions.bin\` at \`0x8000\`, \`boot_app0.bin\` at \`0xe000\`, \`firmware.bin\` at \`0x10000\`. Take a full 16 MB backup first."
            echo
            echo "All boot/application binaries come from the **same CI build** — do not mix with other releases."
            echo
            echo "### Verify"
            echo
            echo "\`SHA256SUMS\` lists the sha256 of every payload file:"
            echo
            echo '```'
            echo 'sha256sum -c SHA256SUMS'
            echo '```'
            echo
            echo "\`boot-components.txt\` is the CI-generated manifest with per-component sizes and hashes."
          } > release-notes.md
          cat release-notes.md

      - name: Publish immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short="${SHORT_SHA::7}"
          tag="rickyos-readpico-${short}"
          title="RickyOS Read Pico ${short} #${RUN_NUMBER}"
          assets=(firmware.bin bootloader.bin partitions.bin boot_app0.bin \
                  firmware.factory.bin boot-components.txt SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists; refreshing assets."
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file release-notes.md --prerelease
          else
            echo "Creating Release $tag."
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" \
              --notes-file release-notes.md --prerelease
          fi
